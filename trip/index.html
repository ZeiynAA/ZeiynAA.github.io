<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbo — Central America Companion</title>

<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3D2E">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f4f6f4; --card:#ffffff; --ink:#15241e; --muted:#5b6d64; --line:#dde5e0;
  --brand:#0E7C66; --brand-ink:#0B3D2E; --accent:#e08a00; --accent-soft:#fff3e0;
  --good:#1a7f4b; --good-soft:#e3f3ea; --flag:#b3261e; --flag-soft:#fdeceb;
  --anchor:#3949ab; --anchor-soft:#e8eaf6;
  --shadow:0 1px 3px rgba(21,36,30,.08),0 4px 14px rgba(21,36,30,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101815; --card:#1a2420; --ink:#e8efe9; --muted:#93a69c; --line:#2a3730;
    --brand:#2fae91; --brand-ink:#bfe8dc; --accent:#ffb347; --accent-soft:#33270f;
    --good:#4cc582; --good-soft:#15301f; --flag:#ff8a80; --flag-soft:#3a1c19;
    --anchor:#9fa8da; --anchor-soft:#232948;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header.app{
  position:sticky;top:0;z-index:20;background:var(--brand-ink);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
@media (prefers-color-scheme: dark){ header.app{background:#0b1512} }
header.app .logo{font-weight:800;font-size:18px;letter-spacing:.3px}
header.app .sub{font-size:12px;opacity:.75;margin-left:auto;text-align:right}
.progress{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-bottom:12px;
}
.card h2{margin:0 0 4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.big{font-size:22px;font-weight:800;line-height:1.25;margin:2px 0}
.mut{color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;vertical-align:middle}
.chip.anchor{background:var(--anchor-soft);color:var(--anchor)}
.chip.flex{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--flag-soft);color:var(--flag)}
.chip.today{background:var(--accent-soft);color:var(--accent)}
button{
  font:inherit;border:0;cursor:pointer;border-radius:12px;
  padding:12px 16px;font-weight:700;color:var(--ink);background:var(--bg);
}
button:active{transform:scale(.97)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-row button{flex:1;min-width:90px;border:1px solid var(--line)}
.btn-primary{background:var(--brand)!important;color:#fff!important;border:0!important}
.btn-ghost{background:transparent}
.item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line);
}
.item:first-of-type{border-top:0}
.item .tick{
  flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);
  background:transparent;padding:0;font-size:15px;line-height:22px;color:#fff;
}
.item.done .tick{background:var(--good);border-color:var(--good)}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item.skip .txt{color:var(--muted);opacity:.55;text-decoration:line-through}
.item.skip .tick{opacity:.4}
.item .txt{flex:1;font-size:15px;padding-top:2px}
.item .more{flex:none;background:transparent;padding:4px 8px;color:var(--muted);font-size:18px;line-height:1}
.anchor-line{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--anchor-soft);color:var(--anchor);font-weight:700;font-size:15px;margin:6px 0}
.anchor-line .ico{flex:none;font-size:18px}
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;background:none;border-radius:0;padding:9px 0 7px;display:flex;flex-direction:column;
  align-items:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);
}
nav.tabs button .ico{font-size:21px;line-height:1.2}
nav.tabs button.on{color:var(--brand)}
.day-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.day-head .dnum{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.daycard.past{opacity:.55}
.daycard.today{border-color:var(--accent);border-width:2px}
.flag{font-size:18px}
details.country{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:10px;box-shadow:var(--shadow)}
details.country summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
details.country summary::-webkit-details-marker{display:none}
details.country[open] summary{border-bottom:1px solid var(--line)}
details.country .body{padding:12px 16px 16px;font-size:14px}
details.country .body b{display:block;margin-top:10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
details.country .body b:first-child{margin-top:0}
.phrase{
  width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;display:block;
}
.phrase .es{font-weight:800;font-size:16px;color:var(--brand);display:block}
@media (prefers-color-scheme: dark){ .phrase .es{color:var(--brand-ink)} }
.phrase .en{font-size:13px;color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);font-size:13px;padding:8px 14px;border-radius:99px}
.cats button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
#overlay{
  position:fixed;inset:0;z-index:50;background:var(--brand-ink);color:#fff;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:18px;
}
#overlay.show{display:flex}
#overlay .es{font-size:clamp(28px,8vw,44px);font-weight:800;line-height:1.25}
#overlay .en{font-size:16px;opacity:.75}
#overlay .btn-row{width:100%;max-width:360px}
#overlay button{background:rgba(255,255,255,.14);color:#fff}
textarea{
  width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);padding:12px;min-height:70px;resize:vertical;
}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.note .t{flex:1;font-size:15px;white-space:pre-wrap}
.note .d{font-size:11px;color:var(--muted)}
.note button{background:transparent;color:var(--muted);padding:2px 8px;font-size:16px}
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0;
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
.freedom{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-ink) 100%);color:#fff;border:0}
.freedom h2{color:rgba(255,255,255,.7)}
.freedom .big{font-size:19px}
.freedom .mut{color:rgba(255,255,255,.75)}
.hidden{display:none!important}
.section-gap{height:8px}
a{color:var(--brand)}
</style>
</head>
<body>

<header class="app">

  <span class="sub" id="head-sub"></span>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Quick note">✍️</button>
<div class="toast" id="toast"></div>

<div id="overlay">
  <div class="es" id="ov-es"></div>

  <div class="btn-row">

/* =====================  STATE  ===================== */

const KEY = "rumbo-v1";
let S = load();
function load(){
  try{ return Object.assign({items:{},moved:{},custom:{},notes:[]}, JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch(e){ return {items:{},moved:{},custom:{},notes:[]}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* =====================  HELPERS  ===================== */

const $ = s => document.querySelector(s);
const fmtDay = ds => new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtDayLong = ds => new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
function todayStr(){
  const n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function dayDiff(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/864e5); }
function dayIndex(ds){ return DAYS.findIndex(d=>d.date===ds); }
function itemId(date,i){ return "f-"+date+"-"+i; }

/* items visible on a given date = own items not moved away + items moved here + custom */
function itemsFor(date){
  const out = [];
  DAYS.forEach(d=>{
    d.flex.forEach((txt,i)=>{
      const id = itemId(d.date,i);
      const home = S.moved[id] || d.date;
      if(home===date) out.push({id,txt,origin:d.date});
    });
  });
  (S.custom[date]||[]).forEach(c=> out.push({id:c.id,txt:c.txt,origin:date,custom:true}));
  return out;
}
function status(id){ return S.items[id]; }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"),1800);
}

const PRAISE = ["Done. 🎉","Nice one. ✅","That's momentum. ⚡","Ticked. 🙌","Boom. 💥","Progress > perfection. ✨"];
function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

/* Freedom window: the next fixed anchor from a given date forward */
function nextAnchor(fromDate){
  for(const d of DAYS){
    if(d.date < fromDate || !d.anchors.length) continue;
    return {day:d, anchor:d.anchors[0], inDays:dayDiff(fromDate,d.date)};
  }
  return null;
}

/* =====================  SPEECH  ===================== */

let esVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v=>/^es[-_](MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!("speechSynthesis" in window)){ toast("Speech not available on this device"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang : "es-MX";
  if(esVoice) u.voice = esVoice;
  u.rate = .88;
  speechSynthesis.speak(u);
}

/* =====================  RENDER: NOW  ===================== */

function renderNow(){
  const t = todayStr();
  const first = DAYS[0].date, last = DAYS[DAYS.length-1].date;
  let html = "";

  if(t < first){
    const n = dayDiff(t, first);
    html += `<div class="card freedom"><h2>Countdown</h2>
      <div class="big">✈️ ${n} day${n===1?"":"s"} until Mexico City</div>
      <div class="mut">Charge the CPAP battery, print nothing, breathe.</div></div>`;
    html += todayCardless();
    $("#main").innerHTML = html; return;
  }
  if(t > last){
    html += `<div class="card"><div class="big">🏠 Trip complete.</div>
      <div class="mut">Six countries, six hikes, one skydive. Notes tab has everything you captured.</div></div>`;
    $("#main").innerHTML = html; return;
  }

  const idx = dayIndex(t);
  const day = DAYS[idx];
  const c = COUNTRIES[day.c];
  const na = nextAnchor(t);

  /* today header */
  html += `<div class="card">
    <h2>Day ${idx+1} of ${DAYS.length} · ${fmtDayLong(t)}</h2>
    <div class="big">${c.flag} ${day.title}</div>
    <div class="mut">🛏 Tonight: ${day.stay}</div>`;
  if(day.anchors.length){
    html += day.anchors.map(a=>`<div class="anchor-line"><span class="ico">${a.ico}</span>${a.label}</div>`).join("");
  }
  html += `</div>`;

  /* freedom window */
  if(na){
    let when = na.inDays===1 ? "tomorrow" : `${fmtDay(na.day.date)} — ${na.inDays} days away`;
    if(na.inDays===0){
      const after = nextAnchorAfter(t);
      html += `<div class="card freedom"><h2>Fixed today</h2>
        <div class="big">${na.anchor.ico} ${na.anchor.label}</div>
        <div class="mut">${after ? `After that, next fixed thing: ${after.anchor.label} ${after.inDays===1?"tomorrow":"in "+after.inDays+" days"}.` : "That's the last fixed thing on the trip."}</div></div>`;
    }else{
      html += `<div class="card freedom"><h2>Freedom window</h2>
        <div class="big">🍃 Nothing is fixed until ${when}</div>
        <div class="mut">${na.anchor.ico} ${na.anchor.label}. Until then: wander freely — the plan below is a menu, not homework.</div></div>`;
    }
  }

  /* one thing */
  const items = itemsFor(t).filter(it=>!status(it.id));
  if(items.length){
    const pick = items[nowPick % items.length];
    html += `<div class="card"><h2>One thing (ignore the rest)</h2>
      <div class="big">${pick.txt}</div>
      <div class="btn-row">
        <button class="btn-primary" onclick="markNow('${pick.id}','done')">✓ Done</button>
        <button onclick="shuffleNow()">🎲 Another</button>
        <button onclick="deferNow('${pick.id}')">→ Tomorrow</button>
        <button onclick="markNow('${pick.id}','skip')">✕ Not this trip</button>
      </div></div>`;
  }else{
    html += `<div class="card"><h2>One thing</h2>
      <div class="big">Nothing left on today's menu. 🎉</div>
      <div class="mut">Wander. Sit in a plaza. Watch the volcano. That IS the trip.</div>
      <div class="btn-row"><button onclick="addSpont()">＋ I found something to do</button></div></div>`;
  }

  /* went rogue */
  if(items.length){
    html += `<div class="card"><h2>Feeling spontaneous?</h2>
      <div class="mut">The day took its own direction? Great — that's why you came.</div>
      <div class="btn-row">
        <button onclick="rogueDay()">🌀 Went rogue — clear today, no guilt</button>
        <button onclick="addSpont()">＋ Add what I'm actually doing</button>
      </div></div>`;
  }

  $("#main").innerHTML = html;
}
function nextAnchorAfter(t){
  for(const d of DAYS){
    if(d.date <= t || !d.anchors.length) continue;
    return {day:d, anchor:d.anchors[0], inDays:dayDiff(t,d.date)};
  }
  return null;
}
function todayCardless(){
  return `<div class="card"><h2>While you wait</h2>
    <div class="item"><span style="font-size:18px">🔋</span><span class="txt">CPAP battery (EASYLONGER ES270) charged + in hand luggage</span></div>
    <div class="item"><span style="font-size:18px">🎫</span><span class="txt">SINAC bookings for Río Celeste + Poás confirmed</span></div>
    <div class="item"><span style="font-size:18px">💉</span><span class="txt">Vaccinations done (GP appointment was booked)</span></div>
    <div class="item"><span style="font-size:18px">📵</span><span class="txt">Plan the Nicaragua phone-sanitise before 20 Aug</span></div></div>`;
}

let nowPick = 0;
function shuffleNow(){ nowPick++; renderNow(); }
function markNow(id,st){ S.items[id]=st; save(); toast(st==="done"?praise():"Skipped — zero guilt."); renderNow(); updateHeader(); }
function deferNow(id){
  const t = todayStr(); const idx = dayIndex(t);
  const next = DAYS[Math.min(idx+1,DAYS.length-1)].date;
  S.moved[id]=next; save(); toast("Moved to tomorrow. 👌"); renderNow();
}
function rogueDay(){
  const t = todayStr();
  itemsFor(t).forEach(it=>{ if(!status(it.id)) S.items[it.id]="skip"; });
  save(); toast("Today is yours. 🌀"); renderNow();
}
function addSpont(){
  const txt = prompt("What are you doing instead?");
  if(!txt) return;
  const t = todayStr();
  (S.custom[t] = S.custom[t]||[]).push({id:"c-"+Date.now(),txt:txt.trim()});
  save(); renderNow(); toast("Added. That counts.");
}

/* =====================  RENDER: DAYS  ===================== */

function renderDays(){
  const t = todayStr();
  let html = `<div class="mut" style="padding:0 2px 10px">
    <span class="chip anchor">fixed</span> can't move · <span class="chip flex">menu</span> swap / skip freely</div>`;
  DAYS.forEach((d,i)=>{
    const c = COUNTRIES[d.c];
    const cls = d.date < t ? "past" : d.date === t ? "today" : "";
    const items = itemsFor(d.date);
    const doneCt = items.filter(it=>status(it.id)==="done").length;
    html += `<div class="card daycard ${cls}" id="day-${d.date}">
      <div class="day-head">
        <span class="dnum">DAY ${i+1}</span>
        <span class="flag">${c.flag}</span>
        <b>${d.title}</b>
        ${d.date===t?'<span class="chip today">today</span>':""}
      </div>
      <div class="mut" style="margin-bottom:6px">${fmtDay(d.date)} · ${c.name}${HIKE_DAYS.includes(d.date)?" · 🥾 hike day":""}${doneCt?` · ${doneCt}✓`:""}</div>
      <div class="mut" style="margin-bottom:6px">🛏 ${d.stay}</div>`;
    html += d.anchors.map(a=>`<div class="anchor-line"><span class="ico">${a.ico}</span>${a.label}</div>`).join("");
    html += items.map(it=>{
      const st = status(it.id)||"";
      return `<div class="item ${st}">
        <button class="tick" onclick="toggleItem('${it.id}')">${st==="done"?"✓":""}</button>
        <span class="txt">${it.txt}${it.origin!==d.date?' <span class="mut">(moved)</span>':""}</span>
        <button class="more" onclick="itemMenu('${it.id}','${d.date}')">⋯</button>
      </div>`;
    }).join("");
    html += `<div class="btn-row"><button class="btn-ghost" onclick="addTo('${d.date}')">＋ add</button></div></div>`;
  });
  $("#main").innerHTML = html;
  const tc = document.getElementById("day-"+t);
  if(tc) tc.scrollIntoView({block:"start"});
}
function toggleItem(id){
  S.items[id] = S.items[id]==="done" ? undefined : "done";
  if(S.items[id]===undefined) delete S.items[id];
  save(); if(S.items[id]==="done") toast(praise());
  renderDays(); updateHeader();
}
function itemMenu(id,date){
  const idx = dayIndex(date);
  const choice = prompt("1 = move to tomorrow\n2 = skip (not this trip)\n3 = un-skip / reset","1");
  if(choice==="1" && idx < DAYS.length-1){ S.moved[id]=DAYS[idx+1].date; toast("Moved. 👌"); }
  else if(choice==="2"){ S.items[id]="skip"; toast("Skipped — zero guilt."); }
  else if(choice==="3"){ delete S.items[id]; delete S.moved[id]; toast("Reset."); }
  save(); renderDays();
}
function addTo(date){
  const txt = prompt("Add to this day:");
  if(!txt) return;
  (S.custom[date] = S.custom[date]||[]).push({id:"c-"+Date.now(),txt:txt.trim()});
  save(); renderDays();
}

/* =====================  RENDER: SPEAK  ===================== */

let cat = "Essentials";
function renderSpeak(){
  let html = `<div class="mut" style="padding:0 2px 8px">Tap a phrase → full-screen card + 🔊. Works offline.</div>`;
  html += `<div class="cats">` + Object.keys(PHRASES).map(k=>
    `<button class="${k===cat?"on":""}" onclick="setCat('${k}')">${k}</button>`).join("") + `</div>`;
  html += PHRASES[cat].map((p,i)=>
    `<button class="phrase" onclick="showPhrase('${cat}',${i})">
      <span class="es">${p[0]}</span><span class="en">${p[1]}</span></button>`).join("");
  html += `<div class="card" style="margin-top:10px"><h2>Anything else</h2>
    <div class="mut">For sentences not in the book, Google Translate's offline Spanish pack + camera mode is the move — download it before Acatenango / borders.</div></div>`;
  $("#main").innerHTML = html;
}
function setCat(k){ cat = k; renderSpeak(); }
let curPhrase = null;
function showPhrase(k,i){
  curPhrase = PHRASES[k][i];
  $("#ov-es").textContent = curPhrase[0];
  $("#ov-en").textContent = curPhrase[1];
  $("#overlay").classList.add("show");
  speak(curPhrase[0]);
}
$("#ov-close").onclick = ()=> $("#overlay").classList.remove("show");
$("#ov-speak").onclick = ()=> curPhrase && speak(curPhrase[0]);

/* =====================  RENDER: NOTES  ===================== */

function renderNotes(){
  let html = `<div class="card"><h2>Brain dump</h2>
    <div class="mut" style="margin-bottom:8px">Park a thought so it stops looping. Names, places someone recommended, "book X", anything.</div>
    <textarea id="note-in" placeholder="Type it, dump it, forget it…"></textarea>
    <div class="btn-row"><button class="btn-primary" onclick="addNote()">Save thought</button></div></div>`;
  if(S.notes.length){
    html += `<div class="card"><h2>Parked thoughts (${S.notes.length})</h2>`;
    html += S.notes.slice().reverse().map((n,ri)=>{
      const i = S.notes.length-1-ri;
      return `<div class="note"><div class="t">${escapeHtml(n.text)}<div class="d">${n.when}</div></div>
        <button onclick="delNote(${i})">🗑</button></div>`;
    }).join("");
    html += `<div class="btn-row"><button onclick="copyNotes()">📋 Copy all</button></div></div>`;
  }
  $("#main").innerHTML = html;
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function addNote(){
  const el = $("#note-in"); const v = (el.value||"").trim();
  if(!v) return;
  S.notes.push({text:v, when:new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})});
  save(); renderNotes(); toast("Parked. Brain freed. 🧠");
}
function delNote(i){ S.notes.splice(i,1); save(); renderNotes(); }
function copyNotes(){
  const txt = S.notes.map(n=>`[${n.when}] ${n.text}`).join("\n");
  navigator.clipboard && navigator.clipboard.writeText(txt).then(()=>toast("Copied."),()=>toast("Couldn't copy"));
}

/* =====================  SHELL  ===================== */

let tab = "now";
const RENDER = {now:renderNow, days:renderDays, speak:renderSpeak, info:renderInfo, notes:renderNotes};
function setTab(t){
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  window.scrollTo(0,0);
  RENDER[t]();
}
document.querySelectorAll("nav.tabs button").forEach(b=> b.onclick = ()=> setTab(b.dataset.tab));
$("#fab").onclick = ()=>{ setTab("notes"); setTimeout(()=>{ const el=$("#note-in"); el&&el.focus(); },50); };

function updateHeader(){
  const t = todayStr();
  const first = DAYS[0].date, last = DAYS[DAYS.length-1].date;
  let sub = "", pct = 0;
  if(t < first){ sub = "Central America · soon"; }
  else if(t > last){ sub = "Trip complete 🎉"; pct = 100; }
  else{
    const i = dayIndex(t);
    const c = COUNTRIES[DAYS[i].c];
    sub = `${c.flag} Day ${i+1} / ${DAYS.length}`;
    pct = Math.round(((i+1)/DAYS.length)*100);
  }
  $("#head-sub").innerHTML = `${sub}<div class="progress" style="width:110px"><i style="width:${pct}%"></i></div>`;
}

updateHeader();
setTab("now");

/* re-render at date rollover / when app is reopened */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ updateHeader(); RENDER[tab](); } });

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
